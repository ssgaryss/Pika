name: CI

on:
  push:
  pull_request:

# 同一分支/PR 有新提交时，取消旧的未完成运行，避免堆积
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.configuration }}
    strategy:
      # 一个平台失败不影响另一个平台继续跑，最终都能看到结果
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        configuration: [Debug, Release]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive   # GLFW/imgui/assimp 等子模块

      # ---------------- macOS ----------------
      - name: Install premake5 (macOS)
        if: runner.os == 'macOS'
        run: brew install premake

      - name: Generate project (macOS)
        if: runner.os == 'macOS'
        run: premake5 gmake2

      - name: Build (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          CONFIG="$(echo "${{ matrix.configuration }}" | tr '[:upper:]' '[:lower:]')"
          make config="${CONFIG}" -j"$(sysctl -n hw.ncpu)"

      # ---------------- Windows ----------------
      - name: Setup MSBuild (Windows)
        if: runner.os == 'Windows'
        uses: microsoft/setup-msbuild@v2

      - name: Generate project (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        # 用仓库内已提交的 premake5.exe，保证版本一致
        run: ./vendor/premake/premake5.exe vs2022

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: msbuild Pika.sln /p:Configuration=${{ matrix.configuration }} /p:Platform=x64 /m
